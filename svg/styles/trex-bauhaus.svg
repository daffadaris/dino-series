<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" class="tr-anim" role="img" aria-label="Animated Tyrannosaurus rex, Bauhaus style">
<title>T. rex (animatable)</title>
<!-- Groups you can animate: #tail #body #leg-far #leg-near #arm-far #arm-near #head #jaw .tr-eyelid
     Each moving group sits inside a wrapper whose origin is its joint, so rotate/scale with transform-origin 0 0
     (GSAP: svgOrigin "0 0"). Remove class="tr-anim" on the root to stop the built-in idle loop. -->
<style>
.tr-tail,.tr-body,.tr-head,.tr-jaw,.tr-arm,.tr-arm-far{transform-origin:0 0}
.tr-eyelid{transform-origin:0 0;transform:scaleY(0)}
.tr-anim .tr-tail{animation:tr-tail 5s ease-in-out infinite}
.tr-anim .tr-body{animation:tr-breath 3.2s ease-in-out infinite}
.tr-anim .tr-head{animation:tr-head 7s ease-in-out infinite}
.tr-anim .tr-jaw{animation:tr-roar 7s ease-in-out infinite}
.tr-anim .tr-eyelid{animation:tr-blink 5s linear infinite}
@keyframes tr-tail{0%,100%{transform:rotate(0)}50%{transform:rotate(-1.5deg)}}
@keyframes tr-breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.006,1.016)}}
@keyframes tr-head{0%,55%,92%,100%{transform:rotate(0)}64%,82%{transform:rotate(-8deg)}}
@keyframes tr-roar{0%,57%,92%,100%{transform:rotate(0)}66%,82%{transform:rotate(16deg)}}
@keyframes tr-blink{0%,93%,100%{transform:scaleY(0)}95.5%{transform:scaleY(1)}}
@media (prefers-reduced-motion: reduce){.tr-anim *{animation:none !important}}
</style>
<defs>
<linearGradient id="trx-shade" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FFF0D8" stop-opacity="0.3"></stop>
<stop offset="0.32" stop-color="#FFF0D8" stop-opacity="0"></stop>
<stop offset="0.66" stop-color="#000000" stop-opacity="0"></stop>
<stop offset="1" stop-color="#000000" stop-opacity="0.4"></stop>
</linearGradient>
<linearGradient id="trx-leg-ao" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#000000" stop-opacity="0.02"></stop>
<stop offset="1" stop-color="#000000" stop-opacity="0.32"></stop>
</linearGradient>
<linearGradient id="trx-tail-fade" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#000000" stop-opacity="0.2"></stop>
<stop offset="0.55" stop-color="#000000" stop-opacity="0"></stop>
</linearGradient>
<radialGradient id="trx-thigh-light" cx="0.4" cy="0.28" r="0.62">
<stop offset="0" stop-color="#FFF0D8" stop-opacity="0.42"></stop>
<stop offset="1" stop-color="#FFF0D8" stop-opacity="0"></stop>
</radialGradient>
<radialGradient id="trx-head-light" cx="0.5" cy="0.2" r="0.7">
<stop offset="0" stop-color="#FFF0D8" stop-opacity="0.36"></stop>
<stop offset="1" stop-color="#FFF0D8" stop-opacity="0"></stop>
</radialGradient>
<pattern id="trx-scales" patternUnits="userSpaceOnUse" width="7" height="12">
<circle cx="3.5" cy="3" r="2.6" fill="none" stroke="#000000" stroke-width="0.6"></circle>
<circle cx="0" cy="9" r="2.6" fill="none" stroke="#000000" stroke-width="0.6"></circle>
<circle cx="7" cy="9" r="2.6" fill="none" stroke="#000000" stroke-width="0.6"></circle>
</pattern>
<pattern id="trx-scales-head" patternUnits="userSpaceOnUse" width="5.000" height="8.571">
<circle cx="2.500" cy="2.143" r="1.857" fill="none" stroke="#000000" stroke-width="0.429"></circle>
<circle cx="0" cy="6.429" r="1.857" fill="none" stroke="#000000" stroke-width="0.429"></circle>
<circle cx="5.000" cy="6.429" r="1.857" fill="none" stroke="#000000" stroke-width="0.429"></circle>
</pattern>
</defs>
