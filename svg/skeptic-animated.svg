<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" class="skp-anim skp-loop" role="img" aria-label="Animated Skeptic">
<title>Skeptic (animatable)</title>
<!-- Groups you can animate: #act, #body, #tail, #head, #leg-near, #leg-far, #arm-near, #arm-far, #forearm-near, .skp-eyelid
     Each moving group sits inside a wrapper whose origin is its joint: rotate/scale with transform-origin 0 0
     (GSAP: svgOrigin "0 0"). Remove the skp-anim class on the root to stop the built-in loop. -->
<style>
.skp-act{transform-origin:0 0}
.skp-body{transform-origin:0 0}
.skp-tail{transform-origin:0 0}
.skp-head{transform-origin:0 0}
.skp-jaw{transform-origin:0 0}
.skp-neck{transform-origin:0 0}
.skp-flush{transform-origin:0 0}
.skp-arm-near{transform-origin:0 0}
.skp-forearm-near{transform-origin:0 0}
.skp-eyelid{transform-origin:0 0;transform:scaleY(0)}
.skp-flush{opacity:0}
.skp-anim .skp-body{animation:skp-breath 3.4s ease-in-out infinite}
.skp-anim .skp-tail{animation:skp-sway 5s ease-in-out infinite}
.skp-anim .skp-eyelid{animation:skp-blink 5.5s linear infinite}
@keyframes skp-breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.005,1.014)}}
@keyframes skp-sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-1.4deg)}}
@keyframes skp-blink{0%,93%,100%{transform:scaleY(0)}95.5%{transform:scaleY(1)}}
@keyframes skp-loop-act{0.0%{transform:translateY(0)}55.0%{transform:translateY(0)}65.0%{transform:translate(12px,-12px) rotate(4deg)}83.0%{transform:translate(12px,-12px) rotate(4deg)}95.0%{transform:translateY(0)}100.0%{transform:translateY(0)}}
.skp-anim.skp-loop .skp-act{animation:skp-loop-act 3.50s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes skp-loop-arm-near{0.0%{transform:rotate(0)}55.0%{transform:rotate(0)}65.0%{transform:rotate(-62deg)}83.0%{transform:rotate(-62deg)}95.0%{transform:rotate(0)}100.0%{transform:rotate(0)}}
.skp-anim.skp-loop .skp-arm-near{animation:skp-loop-arm-near 3.50s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes skp-loop-forearm-near{0.0%{transform:rotate(0)}55.0%{transform:rotate(0)}65.0%{transform:rotate(26deg)}83.0%{transform:rotate(26deg)}95.0%{transform:rotate(0)}100.0%{transform:rotate(0)}}
.skp-anim.skp-loop .skp-forearm-near{animation:skp-loop-forearm-near 3.50s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes skp-loop-head{0.0%{transform:rotate(0)}55.0%{transform:rotate(0)}65.0%{transform:rotate(-6deg)}83.0%{transform:rotate(-6deg)}95.0%{transform:rotate(0)}100.0%{transform:rotate(0)}}
.skp-anim.skp-loop .skp-head{animation:skp-loop-head 3.50s cubic-bezier(.3,.7,.2,1) infinite}
@media (prefers-reduced-motion: reduce){.skp-anim *,.skp-acting *{animation:none !important}}
</style>
<defs>
<linearGradient id="skp-shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF0D8" stop-opacity="0.3"></stop><stop offset="0.32" stop-color="#FFF0D8" stop-opacity="0"></stop><stop offset="0.66" stop-color="#000000" stop-opacity="0"></stop><stop offset="1" stop-color="#000000" stop-opacity="0.4"></stop></linearGradient>
<linearGradient id="skp-ao" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000000" stop-opacity="0.02"></stop><stop offset="1" stop-color="#000000" stop-opacity="0.32"></stop></linearGradient>
<linearGradient id="skp-fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000000" stop-opacity="0.2"></stop><stop offset="0.55" stop-color="#000000" stop-opacity="0"></stop></linearGradient>
<radialGradient id="skp-light" cx="0.4" cy="0.28" r="0.62"><stop offset="0" stop-color="#FFF0D8" stop-opacity="0.4"></stop><stop offset="1" stop-color="#FFF0D8" stop-opacity="0"></stop></radialGradient>
