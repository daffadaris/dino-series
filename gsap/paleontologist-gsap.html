<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
  const q = (s) => document.querySelector(s);
  const parts = { act: q('#act'), body: q('#body'), tail: q('#tail'), head: q('#head'), leg_near: q('#leg-near'), leg_far: q('#leg-far'), arm_near: q('#arm-near'), arm_far: q('#arm-far'), forearm_near: q('#forearm-near'), lid: document.querySelectorAll('.pal-eyelid') };
  gsap.set(Object.values(parts).filter(p => p && !(p instanceof NodeList)), { svgOrigin: '0 0' });
  gsap.set(parts.lid, { svgOrigin: '0 0', scaleY: 0 });
  const mm = gsap.matchMedia();
  mm.add('(prefers-reduced-motion: no-preference)', () => {
    gsap.to(parts.body, { scaleY: 1.014, scaleX: 1.005, duration: 1.7, ease: 'sine.inOut', yoyo: true, repeat: -1 });
    const tailIdle = gsap.to(parts.tail, { rotation: -1.4, duration: 2.5, ease: 'sine.inOut', yoyo: true, repeat: -1 });
    gsap.timeline({ repeat: -1, repeatDelay: 4.5 })
      .to(parts.lid, { scaleY: 1, duration: 0.08, ease: 'power1.in' })
      .to(parts.lid, { scaleY: 0, duration: 0.12, ease: 'power1.out' });
    const act = gsap.timeline({ paused: true })
      .to(parts.act, { y: 8, duration: 0.2, ease: 'power2.out' }, 0)
      .to(parts.act, { y: -44, duration: 0.28, ease: 'power2.out' }, 0.2)
      .to(parts.arm_near, { rotation: -87, duration: 0.3, ease: 'back.out(1.6)' }, 0.2)
      .to(parts.forearm_near, { rotation: 52, duration: 0.3, ease: 'back.out(1.6)' }, 0.2)
      .to(parts.head, { rotation: -8, duration: 0.3 }, 0.2)
      .to(parts.leg_near, { rotation: -18, duration: 0.2 }, 0.22)
      .to(parts.leg_far, { rotation: 14, duration: 0.2 }, 0.22)
      .to(parts.tail, { rotation: -14, duration: 0.25 }, 0.2)
      .to(parts.act, { y: 0, duration: 0.25, ease: 'power2.in' }, 0.62)
      .to([parts.leg_near, parts.leg_far], { rotation: 0, duration: 0.2 }, 0.62)
      .to(parts.tail, { rotation: 6, duration: 0.25 }, 0.62)
      .to(parts.act, { y: 5, duration: 0.08, yoyo: true, repeat: 1 }, 0.87)
      .to([parts.arm_near, parts.forearm_near, parts.head, parts.tail], { rotation: 0, duration: 0.5, ease: 'power2.inOut' }, 1.15);
    // the idle tail sway would fight any move that also turns the tail: pause it while the move plays
    act.eventCallback('onStart', () => tailIdle.pause());
    act.eventCallback('onComplete', () => tailIdle.resume());
    const play = () => act.restart();
    q('#dino').addEventListener('click', play);
    return () => q('#dino').removeEventListener('click', play);
  });
</script>
