<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T. rex 3D model</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/utils/BufferGeometryUtils.js" crossorigin>
<style>
  html, body { margin: 0; height: 100%; background: #C9D6DA; overflow: hidden; font-family: 'Public Sans', system-ui, sans-serif; color: #2B1E16; }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }
  .panel { position: fixed; left: 24px; top: 20px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  .panel h1 { margin: 0; font-family: 'Big Shoulders Display', 'Public Sans', sans-serif; font-weight: 800; font-size: 64px; line-height: 0.9; }
  .panel p { margin: 0; font-size: 15px; line-height: 1.45; max-width: 34ch; }
  .controls { position: fixed; left: 24px; bottom: 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button { font: 600 16px 'Public Sans', system-ui, sans-serif; color: #F4ECE0; background: #2B1E16; border: 0; border-radius: 10px; padding: 12px 20px; min-height: 44px; cursor: pointer; }
  button:hover { background: #4A3426; }
  button:focus-visible { outline: 3px solid #2B1E16; outline-offset: 3px; }
  button.quiet { color: #2B1E16; background: rgba(255,255,255,0.55); }
  button.quiet:hover { background: rgba(255,255,255,0.8); }
  .status { position: fixed; inset: 0; display: grid; place-items: center; font-size: 16px; pointer-events: none; }
  @media (max-width: 600px) { .panel h1 { font-size: 44px; } .panel p { font-size: 14px; } }
</style>
</head>
<body>
<canvas id="stage" aria-label="Interactive 3D model of a Tyrannosaurus rex. Drag to orbit, scroll or pinch to zoom, click the dinosaur to make it roar."></canvas>
<div class="panel">
  <h1>T. rex</h1>
  <p>Drag to turn it around, scroll or pinch to zoom, and click the dinosaur to make it roar.</p>
</div>
<div class="controls">
  <button type="button" id="roar">Roar</button>
  <button type="button" id="reset" class="quiet">Reset view</button>
</div>
<div class="status" id="status">Loading the model…</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
{ const f = document.createElement('link'); f.rel = 'stylesheet';
  f.href = 'https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Public+Sans:wght@400;600&display=swap';
  document.head.appendChild(f); }
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------------------------------------------------------------- palette
const C = {
  skin: new THREE.Color('#9E6B7B'), belly: new THREE.Color('#DCC8A4'), outline: '#2A1C22',
  tooth: '#EFE6D0', claw: '#3A2A2C', eye: '#E0B04A', mouth: '#4A1C1E', tongue: '#8E3A3E',
  sky: '#C9D6DA', ground: '#D6AB72', mesa: '#A7B2B9'
};
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------------------------------------------------------- renderer, scene, camera
const canvas = document.getElementById('stage');
const MAX_PR = Math.min(devicePixelRatio, 1.5);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: devicePixelRatio < 2, powerPreference: 'high-performance' });
let pixelRatio = MAX_PR; renderer.setPixelRatio(pixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate = false;
const scene = new THREE.Scene();
scene.background = new THREE.Color(C.sky);
scene.fog = new THREE.Fog(C.sky, 30, 75);
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 200);
const HOME = { pos: new THREE.Vector3(3.5, 4.2, 19), target: new THREE.Vector3(-0.4, 2.7, 0) };
camera.position.copy(HOME.pos);
const controls = new OrbitControls(camera, canvas);
controls.target.copy(HOME.target);
controls.enableDamping = true;
controls.minDistance = 7; controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI * 0.49;
controls.enablePan = false;

scene.add(new THREE.HemisphereLight('#E8EFF2', '#A07A50', 1.4));
const sun = new THREE.DirectionalLight('#FFF1DC', 2.2);
sun.position.set(6, 14, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 7, bottom: -4, near: 4, far: 30 });
sun.shadow.bias = -0.0008;
scene.add(sun);

// ---------------------------------------------------------------- materials
const ramp = new THREE.DataTexture(new Uint8Array([90, 170, 230, 255]), 4, 1, THREE.RedFormat);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
const toon = (color, vc = false) => new THREE.MeshToonMaterial({ color, gradientMap: ramp, vertexColors: vc });
const skinMat = toon(C.skin);
skinMat.onBeforeCompile = (sh) => {
  sh.uniforms.belly = { value: C.belly };
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nattribute vec3 restPos; attribute vec3 restNrm; attribute vec2 paint; varying vec3 vRest; varying vec3 vRestN; varying vec2 vPaint;')
    .replace('#include <begin_vertex>', '#include <begin_vertex>\nvRest = restPos; vRestN = restNrm; vPaint = paint;');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', `#include <common>
uniform vec3 belly; varying vec3 vRest; varying vec3 vRestN; varying vec2 vPaint;
float mottle(vec3 p){ return sin(p.x*3.4 + sin(p.z*5.3))*sin(p.y*4.3 + p.x*1.0) + 0.5*sin(p.x*8.5 + p.y*6.6 + p.z*3.5); }`)
    .replace('vec4 diffuseColor = vec4( diffuse, opacity );', `
vec3 base = diffuse;
float ny = normalize(vRestN).y;
float bellyAmt = smoothstep(-0.02, -0.38, ny) * vPaint.y;
base = mix(base, belly, bellyAmt);
float up = smoothstep(-0.05, 0.35, ny);
float band = sin(vRest.x * 3.0 + 0.4 * sin(vRest.y * 2.0));
float edge = 1.0 - (0.45 + 0.35 * up) * 0.9;
float aa = fwidth(band) * 1.2;
float stripe = vPaint.x * up * smoothstep(edge - aa, edge + aa, band);
base *= mix(1.0, 0.62, stripe);
float m = mottle(vRest * 1.6);
base *= mix(1.0, 0.86, smoothstep(0.9, 1.0, m));
base = mix(base, base * 1.12, smoothstep(-1.05, -1.15, m) * 0.6);
vec4 diffuseColor = vec4( base, opacity );`);
};
const outlineMat = new THREE.ShaderMaterial({
  uniforms: { thickness: { value: 0.035 }, color: { value: new THREE.Color(C.outline) } },
  vertexShader: `uniform float thickness; void main(){ vec3 p = position + normal * thickness; gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0); }`,
  fragmentShader: `uniform vec3 color; void main(){ gl_FragColor = vec4(color, 1.0); }`,
  side: THREE.BackSide
});

const skinMeshes = [];
function mesh(geo, mat = skinMat, { outline = true, kind = 'body', stripes = false, shadow = true } = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = shadow; m.receiveShadow = shadow;
  if (outline) { const o = new THREE.Mesh(geo, outlineMat); o.raycast = () => {}; m.add(o); }
  if (mat === skinMat) skinMeshes.push({ m, kind, stripes });
  return m;
}
function smooth(geo) {
  for (const k of ['uv', 'normal']) if (geo.getAttribute(k)) geo.deleteAttribute(k);
  geo = mergeVertices(geo, 1e-4);
  geo.computeVertexNormals();
  return geo;
}
const ellipsoid = (rx, ry, rz, w = 44, h = 30) => new THREE.SphereGeometry(1, w, h).scale(rx, ry, rz);

// a tapered limb between two points
const UP = new THREE.Vector3(0, 1, 0);
function limb(a, b, r1, r2, opts) {
  const dir = new THREE.Vector3().subVectors(b, a); const len = dir.length();
  const geo = new THREE.CylinderGeometry(r2, r1, len, 18, 3, false);
  const m = mesh(geo, skinMat, opts);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(UP, dir.normalize());
  return m;
}
const ball = (p, r, opts) => { const m = mesh(new THREE.SphereGeometry(r, 18, 12), skinMat, opts); m.position.copy(p); return m; };

// SVG path (M, L, C, Z) to a THREE.Shape; x right, y flipped up
function shapeFromSvg(d, s, ox, oy) {
  const t = d.match(/[MLCZ]|-?\d*\.?\d+/g); const shape = new THREE.Shape(); let i = 0, cmd = 'M';
  const P = () => { const x = (+t[i++] - ox) * s, y = -(+t[i++] - oy) * s; return [x, y]; };
  while (i < t.length) {
    if (/[MLCZ]/.test(t[i])) { cmd = t[i++]; if (cmd === 'Z') continue; }
    if (cmd === 'M') { shape.moveTo(...P()); cmd = 'L'; }
    else if (cmd === 'L') shape.lineTo(...P());
    else if (cmd === 'C') { const a = P(), b = P(), c = P(); shape.bezierCurveTo(...a, ...b, ...c); }
  }
  return shape;
}
// extrude a side profile, then taper its width toward the snout
function profile(d, depth, taper, { s, ox, oy, x0, x1 }) {
  let geo = new THREE.ExtrudeGeometry(shapeFromSvg(d, s, ox, oy), { depth, bevelEnabled: true, bevelThickness: 0.1, bevelSize: 0.06, bevelSegments: 3, curveSegments: 20 });
  geo.translate(0, 0, -depth / 2);
  const p = geo.attributes.position;
  for (let k = 0; k < p.count; k++) {
    const u = THREE.MathUtils.clamp((p.getX(k) - x0) / (x1 - x0), 0, 1);
    p.setZ(k, p.getZ(k) * (1 - taper * u * u));
  }
  return smooth(geo);
}

// ---------------------------------------------------------------- the animal
const rex = new THREE.Group(); scene.add(rex);
const hips = new THREE.Group(); hips.position.set(0, 3.75, 0); rex.add(hips);
const trunk = new THREE.Group(); hips.add(trunk);                 // breathes

// trunk masses
const hipMass = mesh(ellipsoid(1.6, 1.3, 0.95), skinMat, { stripes: true }); hipMass.position.set(-0.3, 0.05, 0); trunk.add(hipMass);
const belly = mesh(ellipsoid(2.6, 1.55, 1.05), skinMat, { stripes: true }); belly.position.set(1.15, -0.35, 0); belly.rotation.z = -0.06; trunk.add(belly);
const chest = mesh(ellipsoid(1.35, 1.4, 0.9), skinMat, { stripes: true }); chest.position.set(2.65, -0.45, 0); chest.rotation.z = 0.25; trunk.add(chest);

// neck and head
const neckJoint = new THREE.Group(); neckJoint.position.set(3.1, 0.25, 0); neckJoint.rotation.z = 0.62; trunk.add(neckJoint);
const neck = mesh(new THREE.CylinderGeometry(0.66, 0.92, 1.55, 30, 4).rotateZ(-Math.PI / 2).translate(0.78, 0, 0).scale(1, 1, 0.85), skinMat, { stripes: true }); neckJoint.add(neck);
const neckEnd = ball(new THREE.Vector3(1.5, 0, 0), 0.68, { stripes: true }); neckJoint.add(neckEnd);
const headPivot = new THREE.Group(); headPivot.position.set(1.55, 0.05, 0); headPivot.rotation.z = -0.74; neckJoint.add(headPivot);
const head = new THREE.Group(); head.position.set(-0.1, -0.32, 0); headPivot.add(head);

const HS = { s: 0.0108, ox: 816, oy: 198, x0: 0, x1: 1.85 };   // skull outline units -> metres, hinge at origin
const SKULL = 'M804 142 C820 126 846 118 870 118 C880 118 888 121 894 126 C902 122 912 122 922 125 C944 130 962 140 974 152 C982 160 984 172 980 182 L974 188 C940 194 880 202 836 206 C816 208 802 200 796 186 C790 170 792 154 804 142 Z';
const JAWP = 'M804 196 L972 188 C980 190 980 198 974 202 C952 216 902 228 852 234 C828 236 808 230 800 218 C794 208 796 200 804 196 Z';
const MOUTH = 'M816 198 C860 180 914 158 956 146 C968 158 976 174 974 190 Z';
const skull = mesh(profile(SKULL, 0.76, 0.5, HS), skinMat, { kind: 'head' }); head.add(skull);
const jaw = new THREE.Group(); head.add(jaw);                     // hinge at origin
jaw.add(mesh(profile(JAWP, 0.64, 0.5, HS), skinMat, { kind: 'head' }));
jaw.add(mesh(profile(MOUTH, 0.44, 0.45, HS), toon(C.mouth), { outline: false }));
const tongue = mesh(ellipsoid(0.68, 0.07, 0.2), toon(C.tongue), { outline: false }); tongue.position.set(0.92, 0.06, 0); jaw.add(tongue);

const headX = x => (x - HS.ox) * HS.s, headY = y => -(y - HS.oy) * HS.s;
const halfW = (X, depth) => (depth / 2) * (1 - 0.5 * Math.min(Math.max(X / 1.85, 0), 1) ** 2) + 0.08;
const toothMat = toon(C.tooth), clawMat = toon(C.claw);
// collects small static pieces and merges them into a single mesh per parent
function batcher(mat) {
  const parts = [];
  return { add(m) { m.updateMatrix(); parts.push(m.geometry.clone().applyMatrix4(m.matrix)); },
           flush(parent) { if (parts.length) parent.add(new THREE.Mesh(mergeGeometries(parts), mat)); } };
}
const upperTeeth = batcher(toothMat), lowerTeeth = batcher(toothMat);
for (const side of [1, -1]) {
  for (let x = 846; x <= 968; x += 15) {                          // upper teeth along the lip
    const y = 206 - (x - 836) * (18 / 138), X = headX(x);
    const t = new THREE.Mesh(new THREE.ConeGeometry(0.042, 0.17 + 0.05 * Math.sin((x - 846) / 30), 10), toothMat);
    t.rotation.x = Math.PI; t.position.set(X, headY(y) - 0.06, side * (halfW(X, 0.76) - 0.06)); upperTeeth.add(t);
  }
  for (let x = 856; x <= 960; x += 17) {                          // lower teeth, hidden until the jaw opens
    const y = 196 - (x - 804) * (8 / 168), X = headX(x);
    const t = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.12, 10), toothMat);
    t.position.set(X, headY(y) + 0.05, side * (halfW(X, 0.64) - 0.1)); lowerTeeth.add(t);
  }
  const eyeX = headX(878), eyeY = headY(140), ez = side * (halfW(eyeX, 0.76) - 0.02);
  const eye = new THREE.Group(); eye.position.set(eyeX, eyeY, ez); head.add(eye); eye.userData.isEye = true;
  eye.add(new THREE.Mesh(new THREE.SphereGeometry(0.09, 14, 10), toon(C.eye)));
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.05, 14, 10), toon('#15110D')); pupil.position.z = side * 0.06; eye.add(pupil);
  const brow = mesh(ellipsoid(0.2, 0.06, 0.08, 14, 8), skinMat, { kind: 'head', shadow: false }); brow.position.set(eyeX + 0.02, eyeY + 0.1, ez * 0.95); brow.rotation.z = -0.15; head.add(brow);
  const horn = mesh(ellipsoid(0.08, 0.09, 0.06, 12, 8), skinMat, { kind: 'head', shadow: false }); horn.position.set(headX(896), headY(124), side * (halfW(headX(896), 0.76) - 0.12)); head.add(horn);
  const nostril = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), toon('#2A1C22')); nostril.position.set(headX(968), headY(158), side * (halfW(headX(968), 0.76) - 0.05)); head.add(nostril);
}
upperTeeth.flush(head); lowerTeeth.flush(jaw);
const eyes = []; head.traverse(o => { if (o.userData.isEye) eyes.push(o); });

// arms
const arms = [];
for (const side of [1, -1]) {
  const shoulder = new THREE.Group(); shoulder.position.set(2.9, -1.05, side * 0.6); trunk.add(shoulder);
  const s0 = new THREE.Vector3(0, 0, 0), e = new THREE.Vector3(0.28, -0.42, side * 0.05), w = new THREE.Vector3(0.62, -0.5, side * 0.08);
  shoulder.add(limb(s0, e, 0.13, 0.1), limb(e, w, 0.1, 0.07), ball(e, 0.1));
  const claws = batcher(clawMat);
  for (const dz of [0.04, -0.04]) {
    const tip = w.clone().add(new THREE.Vector3(0.16, -0.12, dz));
    shoulder.add(limb(w, tip, 0.04, 0.025, { outline: false, shadow: false }));
    const claw = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.1, 6), clawMat); claw.position.copy(tip); claw.rotation.z = Math.PI * 0.85; claws.add(claw);
  }
  claws.flush(shoulder);
  arms.push(shoulder);
}

// legs (static, posed in a planted stance)
const legGroups = [];
function leg(side, dx) {
  const g = new THREE.Group(); legGroups.push(g); g.position.set(dx, 0, side * 0.7); hips.add(g);
  const P = (x, y) => new THREE.Vector3(x, y, 0);
  const hip = P(0, -0.25), knee = P(0.7, -1.85), ankle = P(0.05, -3.05), ballP = P(0.42, -3.6);
  const thigh = mesh(ellipsoid(0.75, 1.3, 0.62), skinMat, { kind: 'leg' });
  thigh.position.set(0.32, -0.95, 0); thigh.rotation.z = 0.28; g.add(thigh);
  const calf = mesh(ellipsoid(0.42, 0.85, 0.42), skinMat, { kind: 'leg' }); calf.position.set(0.48, -2.3, 0); calf.rotation.z = -0.55; g.add(calf);
  g.add(limb(knee, ankle, 0.36, 0.2, { kind: 'leg' }), limb(ankle, ballP, 0.19, 0.15, { kind: 'leg' }), ball(ankle, 0.2, { kind: 'leg' }), ball(ballP, 0.17, { kind: 'leg' }));
  const claws = batcher(clawMat);
  for (const [ang, len] of [[0.32, 0.62], [0, 0.78], [-0.32, 0.62]]) {
    const tip = ballP.clone().add(new THREE.Vector3(Math.cos(ang) * len, -0.1, Math.sin(ang) * len * 1.1));
    g.add(limb(ballP, tip, 0.12, 0.07, { kind: 'leg' }));
    const claw = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.2, 8), clawMat);
    claw.position.copy(tip).add(new THREE.Vector3(Math.cos(ang) * 0.08, -0.02, Math.sin(ang) * 0.08)); claw.rotation.z = -Math.PI / 2 - 0.25; claw.rotation.y = -ang; claws.add(claw);
  }
  const dew = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.14, 6), clawMat); dew.position.set(-0.05, -3.2, 0); dew.rotation.z = Math.PI * 0.75; claws.add(dew);
  claws.flush(g);
}
leg(1, 0.15); leg(-1, -0.45);

// tail: one continuous tapered mesh, bent each frame along a swaying centreline
const TL = 7.4, RINGS = 60, RAD = 28;
const tailR = u => 1.0 * Math.pow(1 - u, 1.15) + 0.035;
const tailGeo = new THREE.BufferGeometry();
const tPos = [], tOff = [], tRing = [], tIdx = [];
for (let i = 0; i <= RINGS; i++) {
  const u = i / RINGS, r = tailR(u);
  for (let k = 0; k < RAD; k++) {
    const a = (k / RAD) * Math.PI * 2, oy = Math.cos(a) * r * 1.12, oz = Math.sin(a) * r * 0.8;
    tPos.push(-u * TL, oy, oz); tOff.push(0, oy, oz); tRing.push(i);
  }
}
const tipIndex = tPos.length / 3; tPos.push(-TL - 0.05, 0, 0); tOff.push(0, 0, 0); tRing.push(RINGS + 1);
for (let i = 0; i < RINGS; i++) for (let k = 0; k < RAD; k++) {
  const a = i * RAD + k, b = i * RAD + (k + 1) % RAD, c = a + RAD, d = b + RAD;
  tIdx.push(a, c, b, b, c, d);
}
for (let k = 0; k < RAD; k++) tIdx.push(RINGS * RAD + k, tipIndex, RINGS * RAD + (k + 1) % RAD);
tailGeo.setIndex(tIdx);
tailGeo.setAttribute('position', new THREE.Float32BufferAttribute(tPos, 3));
tailGeo.computeVertexNormals();
const tailRestN = tailGeo.attributes.normal.array.slice();
const tail = mesh(tailGeo, skinMat, { stripes: true, kind: 'tail' });
tail.position.set(-0.55, 0.12, 0); tail.frustumCulled = false; tail.children[0].frustumCulled = false; trunk.add(tail);
const ringM = Array.from({ length: RINGS + 2 }, () => new THREE.Matrix4()), ringC = Array.from({ length: RINGS + 2 }, () => new THREE.Vector3());
const mz = new THREE.Matrix4(), my = new THREE.Matrix4(), tv = new THREE.Vector3(), tn = new THREE.Vector3();
const tailC = new THREE.Vector3();
function bendTail(t) {
  const step = TL / RINGS; const c = tailC.set(0, 0, 0);
  for (let i = 0; i <= RINGS + 1; i++) {
    const u = Math.min(i / RINGS, 1);
    const pitch = -0.1 + 0.22 * u * u + (reduceMotion ? 0 : 0.03 * Math.sin(t * 0.9 - u * 2.5) * u);
    const yaw = reduceMotion ? 0 : 0.32 * Math.sin(t * 1.1 - u * 2.6) * u * u;
    ringM[i].multiplyMatrices(my.makeRotationY(yaw), mz.makeRotationZ(pitch));
    ringC[i].copy(c);
    if (i <= RINGS) c.add(tv.set(-step, 0, 0).applyMatrix4(ringM[i]));
  }
  const P = tailGeo.attributes.position.array, N = tailGeo.attributes.normal.array;
  for (let v = 0; v < tRing.length; v++) {
    const i = tRing[v];
    if (i > RINGS) { tv.set(-0.05, 0, 0).applyMatrix4(ringM[RINGS]).add(ringC[RINGS + 1]); }
    else tv.set(tOff[v * 3], tOff[v * 3 + 1], tOff[v * 3 + 2]).applyMatrix4(ringM[i]).add(ringC[i]);
    P[v * 3] = tv.x; P[v * 3 + 1] = tv.y; P[v * 3 + 2] = tv.z;
    tn.set(tailRestN[v * 3], tailRestN[v * 3 + 1], tailRestN[v * 3 + 2]).applyMatrix4(ringM[Math.min(i, RINGS)]);
    N[v * 3] = tn.x; N[v * 3 + 1] = tn.y; N[v * 3 + 2] = tn.z;
  }
  tailGeo.attributes.position.needsUpdate = true; tailGeo.attributes.normal.needsUpdate = true;
}
bendTail(0);
const tailRestPose = tailGeo.attributes.position.array.slice();   // painted from the rest pose
const tailRestNormals = tailGeo.attributes.normal.array.slice();

// ---------------------------------------------------------------- paint (rest-pose coordinates, so markings stick to the skin)
rex.updateMatrixWorld(true);
const v = new THREE.Vector3(), n = new THREE.Vector3(), nm = new THREE.Matrix3();
for (const { m, stripes, kind } of skinMeshes) {
  const g = m.geometry, p = g.attributes.position, no = g.attributes.normal;
  const rp = new Float32Array(p.count * 3), rn = new Float32Array(p.count * 3), pa = new Float32Array(p.count * 2);
  nm.getNormalMatrix(m.matrixWorld);
  for (let k = 0; k < p.count; k++) {
    v.fromBufferAttribute(p, k).applyMatrix4(m.matrixWorld);
    n.fromBufferAttribute(no, k).applyMatrix3(nm).normalize();
    rp.set([v.x, v.y, v.z], k * 3); rn.set([n.x, n.y, n.z], k * 3);
    pa.set([stripes ? 1 : 0, kind === 'leg' ? 0.35 : 1], k * 2);
  }
  g.setAttribute('restPos', new THREE.BufferAttribute(rp, 3));
  g.setAttribute('restNrm', new THREE.BufferAttribute(rn, 3));
  g.setAttribute('paint', new THREE.BufferAttribute(pa, 2));
}

// ---------------------------------------------------------------- merge static skin pieces: one mesh + one outline per moving group
function mergeSkin(group, exclude = []) {
  const ms = group.children.filter(o => o.isMesh && o.material === skinMat && !exclude.includes(o));
  if (ms.length < 2) return;
  const geos = ms.map(m => { m.updateMatrix(); const g = m.geometry.clone(); if (g.getAttribute('uv')) g.deleteAttribute('uv'); return g.applyMatrix4(m.matrix); });
  const merged = mergeGeometries(geos);
  if (!merged) return;                       // attribute mismatch: keep the separate pieces
  ms.forEach(m => group.remove(m));
  group.add(mesh(merged, skinMat, { shadow: ms.some(m => m.castShadow) }));
}
legGroups.forEach(g => mergeSkin(g));
arms.forEach(a => mergeSkin(a));
mergeSkin(trunk, [tail]);
mergeSkin(neckJoint);
mergeSkin(head);

// ---------------------------------------------------------------- scenery
const ground = new THREE.Mesh(new THREE.CircleGeometry(70, 64).rotateX(-Math.PI / 2), toon(C.ground)); ground.receiveShadow = true; scene.add(ground);
for (const [r, w, h, c] of [[14, 1.2, 0.04, '#C08A55'], [18, 1.6, 0.03, '#E5C895'], [24, 1.4, 0.02, '#B5763F']]) {
  const ring = new THREE.Mesh(new THREE.RingGeometry(r, r + w, 64).rotateX(-Math.PI / 2), toon(c)); ring.position.y = h; ring.receiveShadow = true; scene.add(ring);
}
const mesaMat = toon(C.mesa);
for (const [x, z, w, h, d] of [[-30, -42, 16, 5, 7], [-6, -50, 20, 7, 8], [22, -44, 14, 4.5, 6], [40, -30, 10, 6, 6], [-42, -20, 9, 4, 6]]) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(w * 0.42, w * 0.55, h, 7), mesaMat); m.position.set(x, h / 2, z); scene.add(m);
}

// ---------------------------------------------------------------- motion
const clock = new THREE.Clock();
let roarStart = -10, nextBlink = 2.5;
const ease = t => t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
const backOut = t => { const c = 1.9; return 1 + (c + 1) * (t - 1) ** 3 + c * (t - 1) ** 2; };
function roarCurve(t) {             // returns 0..1 head lift / jaw open, with a short wind-up
  if (t < 0 || t > 1.7) return { lift: 0, open: 0 };
  if (t < 0.25) return { lift: -0.25 * ease(t / 0.25), open: 0 };
  if (t < 0.6) { const u = backOut((t - 0.25) / 0.35); return { lift: -0.25 + 1.25 * u, open: u }; }
  if (t < 1.2) return { lift: 1, open: 1 - 0.08 * Math.abs(Math.sin((t - 0.6) * 40)) };
  const u = ease((t - 1.2) / 0.5); return { lift: 1 - u, open: 1 - u };
}
function roar() { roarStart = clock.getElapsedTime(); }
document.getElementById('roar').addEventListener('click', roar);
document.getElementById('reset').addEventListener('click', () => { camera.position.copy(HOME.pos); controls.target.copy(HOME.target); controls.update(); });

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) return;
  const r = canvas.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  if (ray.intersectObject(rex, true).length) roar();
});

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.position.z = HOME.pos.z * Math.max(1, 1.35 / (w / h)); // keep the whole animal in frame on tall screens
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const neckBase = neckJoint.rotation.z, headBase = headPivot.rotation.z;
let frame = 0, acc = 0, lastNow = performance.now();
function adapt() {                       // keep frames near 60 fps by trading resolution
  const now = performance.now(), dt = now - lastNow; lastNow = now; acc += dt;
  if (++frame % 60) return;
  const avg = acc / 60; acc = 0;
  const next = avg > 22 ? Math.max(0.75, pixelRatio - 0.25) : avg < 14 ? Math.min(MAX_PR, pixelRatio + 0.25) : pixelRatio;
  if (next !== pixelRatio) { pixelRatio = next; renderer.setPixelRatio(pixelRatio); resize(); }
}
function loop() {
  if (document.hidden) return;
  adapt();
  renderer.shadowMap.needsUpdate = frame % 2 === 0;
  const t = clock.getElapsedTime();
  if (!reduceMotion) {
    trunk.scale.set(1, 1 + 0.012 * Math.sin(t * 2.0), 1 + 0.008 * Math.sin(t * 2.0));
    bendTail(t);
    headPivot.rotation.y = 0.07 * Math.sin(t * 0.35);
    if (t > nextBlink) { const k = t - nextBlink; const s = k < 0.07 ? 1 - k / 0.07 : k < 0.16 ? (k - 0.07) / 0.09 : 1; eyes.forEach(e => e.scale.y = Math.max(0.08, s)); if (k > 0.16) nextBlink = t + 3 + Math.random() * 3; }
  }
  const { lift, open } = roarCurve(t - roarStart);
  neckJoint.rotation.z = neckBase + 0.12 * lift;
  headPivot.rotation.z = headBase + 0.22 * lift;
  jaw.rotation.z = -0.5 * open;
  arms.forEach(a => a.rotation.z = -0.35 * open);
  controls.update();
  renderer.render(scene, camera);
}
// compile every shader before the first frame, off the main thread where the browser supports it
function start() { renderer.setAnimationLoop(loop); document.getElementById('status').remove(); }
renderer.shadowMap.needsUpdate = true;
(renderer.compileAsync ? renderer.compileAsync(scene, camera) : Promise.resolve()).catch(() => {}).then(start);
</script>
</body>
</html>
