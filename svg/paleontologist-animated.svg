<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" class="pal-anim pal-loop" role="img" aria-label="Animated Paleontologist">
<title>Paleontologist (animatable)</title>
<!-- Groups you can animate: #act, #body, #tail, #head, #leg-near, #leg-far, #arm-near, #arm-far, #forearm-near, .pal-eyelid
     Each moving group sits inside a wrapper whose origin is its joint: rotate/scale with transform-origin 0 0
     (GSAP: svgOrigin "0 0"). Remove the pal-anim class on the root to stop the built-in loop. -->
<style>
.pal-act{transform-origin:0 0}
.pal-body{transform-origin:0 0}
.pal-tail{transform-origin:0 0}
.pal-head{transform-origin:0 0}
.pal-jaw{transform-origin:0 0}
.pal-neck{transform-origin:0 0}
.pal-flush{transform-origin:0 0}
.pal-arm-near{transform-origin:0 0}
.pal-forearm-near{transform-origin:0 0}
.pal-leg-near{transform-origin:0 0}
.pal-leg-far{transform-origin:0 0}
.pal-eyelid{transform-origin:0 0;transform:scaleY(0)}
.pal-flush{opacity:0}
.pal-anim .pal-body{animation:pal-breath 3.4s ease-in-out infinite}
.pal-anim .pal-tail{animation:pal-sway 5s ease-in-out infinite}
.pal-anim .pal-eyelid{animation:pal-blink 5.5s linear infinite}
@keyframes pal-breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.005,1.014)}}
@keyframes pal-sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-1.4deg)}}
@keyframes pal-blink{0%,93%,100%{transform:scaleY(0)}95.5%{transform:scaleY(1)}}
@keyframes pal-loop-act{0.0%{transform:translateY(0)}55.0%{transform:translateY(0)}59.8%{transform:translateY(8px)}67.0%{transform:translateY(-44px)}71.8%{transform:translateY(-44px)}77.0%{transform:translateY(0)}79.0%{transform:translateY(5px)}81.4%{transform:translateY(0)}95.0%{transform:translateY(0)}100.0%{transform:translateY(0)}}
.pal-anim.pal-loop .pal-act{animation:pal-loop-act 4.00s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes pal-loop-arm-near{0.0%{transform:rotate(0)}55.0%{transform:rotate(0)}59.8%{transform:rotate(8deg)}67.8%{transform:rotate(-87deg)}85.0%{transform:rotate(-87deg)}95.0%{transform:rotate(0)}100.0%{transform:rotate(0)}}
.pal-anim.pal-loop .pal-arm-near{animation:pal-loop-arm-near 4.00s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes pal-loop-forearm-near{0.0%{transform:rotate(0)}55.0%{transform:rotate(0)}67.8%{transform:rotate(52deg)}85.0%{transform:rotate(52deg)}95.0%{transform:rotate(0)}100.0%{transform:rotate(0)}}
.pal-anim.pal-loop .pal-forearm-near{animation:pal-loop-forearm-near 4.00s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes pal-loop-head{0.0%{transform:rotate(0)}55.0%{transform:rotate(0)}67.8%{transform:rotate(-8deg)}85.0%{transform:rotate(-8deg)}95.0%{transform:rotate(0)}100.0%{transform:rotate(0)}}
.pal-anim.pal-loop .pal-head{animation:pal-loop-head 4.00s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes pal-loop-leg-near{0.0%{transform:rotate(0)}55.0%{transform:rotate(0)}60.6%{transform:rotate(0)}67.0%{transform:rotate(-18deg)}75.0%{transform:rotate(0)}95.0%{transform:rotate(0)}100.0%{transform:rotate(0)}}
.pal-anim.pal-loop .pal-leg-near{animation:pal-loop-leg-near 4.00s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes pal-loop-leg-far{0.0%{transform:rotate(0)}55.0%{transform:rotate(0)}60.6%{transform:rotate(0)}67.0%{transform:rotate(14deg)}75.0%{transform:rotate(0)}95.0%{transform:rotate(0)}100.0%{transform:rotate(0)}}
.pal-anim.pal-loop .pal-leg-far{animation:pal-loop-leg-far 4.00s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes pal-loop-tail{0.0%{transform:rotate(0)}55.0%{transform:rotate(0)}67.0%{transform:rotate(-14deg)}77.0%{transform:rotate(6deg)}95.0%{transform:rotate(0)}100.0%{transform:rotate(0)}}
.pal-anim.pal-loop .pal-tail{animation:pal-loop-tail 4.00s cubic-bezier(.3,.7,.2,1) infinite}
@media (prefers-reduced-motion: reduce){.pal-anim *,.pal-acting *{animation:none !important}}
</style>
