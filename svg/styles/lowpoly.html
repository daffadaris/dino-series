<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Low-poly: 6 species</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&amp;family=Public+Sans:wght@400;600&amp;display=swap">
<style>body{margin:0;padding:40px 56px;background:#3E3E40;color:#ECE6E8;font-family:'Public Sans',system-ui,sans-serif}
h1{margin:0 0 6px;font:900 56px/1 'Big Shoulders Display',sans-serif}p{margin:0 0 18px;color:#B9B3B6;max-width:70ch}
nav{display:flex;gap:8px;margin-bottom:24px}button{font:600 14px 'Public Sans',sans-serif;padding:6px 14px;border-radius:4px;border:1px solid #8A8487;background:none;color:inherit;cursor:pointer}
button[aria-pressed=true]{background:#ECE6E8;color:#3E3E40}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--w,440px),1fr));gap:24px}
figure{margin:0}.tile{position:relative;border-radius:6px;overflow:hidden}
.tile svg,.tile img{position:absolute;inset:0;width:100%;height:100%}
figcaption{margin-top:8px;font-size:14px;color:#B9B3B6}figcaption b{color:#ECE6E8;display:block;font-size:16px}
body.thumbs{--w:110px}body.thumbs figcaption{font-size:11px}body.thumbs figcaption b{font-size:12px}body.grey main{filter:grayscale(1)}
@media (max-width:600px){body{padding:24px 16px}main{grid-template-columns:1fr}}
</style></head><body>
<h1>Low-poly: 6 dinosaurs</h1>
<p>Lit triangles, no lines. Each one is built from its species drawing in svg/, with the same groups, pivots and idle motion.</p>
<main>
<figure><div class="tile" style="background:#3E5868;aspect-ratio:1000/560"><img src="trex-lowpoly.svg" alt="Low-poly Tyrannosaurus rex"></div><figcaption><b><i>Tyrannosaurus rex</i></b> about 12 m long</figcaption></figure>
<figure><div class="tile" style="background:#3E5868;aspect-ratio:1000/560"><img src="triceratops-lowpoly.svg" alt="Low-poly Triceratops horridus"></div><figcaption><b><i>Triceratops horridus</i></b> about 8.5 m long</figcaption></figure>
<figure><div class="tile" style="background:#3E5868;aspect-ratio:1000/560"><img src="stegosaurus-lowpoly.svg" alt="Low-poly Stegosaurus stenops"></div><figcaption><b><i>Stegosaurus stenops</i></b> about 6.5 m long</figcaption></figure>
<figure><div class="tile" style="background:#3E5868;aspect-ratio:1000/700"><img src="titanosaur-lowpoly.svg" alt="Low-poly Patagotitan mayorum"></div><figcaption><b><i>Patagotitan mayorum</i></b> about 31 m long</figcaption></figure>
<figure><div class="tile" style="background:#3E5868;aspect-ratio:1000/560"><img src="ankylosaurus-lowpoly.svg" alt="Low-poly Ankylosaurus magniventris"></div><figcaption><b><i>Ankylosaurus magniventris</i></b> about 7 m long</figcaption></figure>
<figure><div class="tile" style="background:#3E5868;aspect-ratio:1000/560"><img src="spinosaurus-lowpoly.svg" alt="Low-poly Spinosaurus aegyptiacus"></div><figcaption><b><i>Spinosaurus aegyptiacus</i></b> about 14 m long</figcaption></figure>
</main></body></html>
