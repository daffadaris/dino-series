  const parts = { act: q('#act'), body: q('#body'), chest: q('#chest'), abdomen: q('#abdomen'), pelvis: q('#pelvis'), tail: q('#tail'), tail_2: q('#tail-2'), tail_3: q('#tail-3'), neck: q('#neck'), head: q('#head'), skull: q('#skull'), upper_jaw: q('#upper-jaw'), jaw: q('#jaw'), teeth_upper: q('#teeth-upper'), teeth_lower: q('#teeth-lower'), eye_near: q('#eye-near'), eye_far: q('#eye-far'), leg_near: q('#leg-near'), leg_far: q('#leg-far'), arm_near: q('#arm-near'), arm_far: q('#arm-far'), lid: document.querySelectorAll('.tr-eyelid') };
  gsap.set(Object.values(parts).filter(p => p && !(p instanceof NodeList)), { svgOrigin: '0 0' });
  gsap.set(parts.lid, { svgOrigin: '0 0', scaleY: 0 });
  const mm = gsap.matchMedia();
  mm.add('(prefers-reduced-motion: no-preference)', () => {
    gsap.to(parts.body, { scaleY: 1.014, scaleX: 1.005, duration: 1.7, ease: 'sine.inOut', yoyo: true, repeat: -1 });
    const tailIdle = gsap.to(parts.tail, { rotation: -1.4, duration: 2.5, ease: 'sine.inOut', yoyo: true, repeat: -1 });
    gsap.timeline({ repeat: -1, repeatDelay: 4.5 })
      .to(parts.lid, { scaleY: 1, duration: 0.08, ease: 'power1.in' })
      .to(parts.lid, { scaleY: 0, duration: 0.12, ease: 'power1.out' });
    const act = gsap.timeline({ paused: true })
      .to(parts.head, { rotation: 4, duration: 0.25, ease: 'power2.out' }, 0)
      .to(parts.neck, { rotation: 2, duration: 0.25, ease: 'power2.out' }, 0)
      .to(parts.head, { rotation: -8, duration: 0.35, ease: 'back.out(2)' }, 0.25)
      .to(parts.neck, { rotation: -4, duration: 0.35, ease: 'power2.out' }, 0.25)
      .to(parts.jaw, { rotation: 18, duration: 0.3, ease: 'power3.out' }, 0.25)
      .to([parts.arm_near, parts.arm_far], { rotation: 14, duration: 0.3, ease: 'power2.out', stagger: 0.05 }, 0.25)
      .to(parts.jaw, { rotation: 15, duration: 0.08, yoyo: true, repeat: 5, ease: 'none' }, 0.55)
      .to([parts.head, parts.neck, parts.jaw, parts.arm_near, parts.arm_far], { rotation: 0, duration: 0.5, ease: 'power2.inOut' }, 1.15);
    // the idle tail sway would fight any move that also turns the tail: pause it while the move plays
    act.eventCallback('onStart', () => tailIdle.pause());
    act.eventCallback('onComplete', () => tailIdle.resume());
    const play = () => act.restart();
    q('#dino').addEventListener('click', play);
    return () => q('#dino').removeEventListener('click', play);
  });
</script>
</body>
</html>
