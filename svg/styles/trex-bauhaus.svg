idth="65.1" height="19.5" transform="rotate(45 777.1 323.1)" fill="#1D1E30" style="mix-blend-mode:multiply"/><rect x="744.7" y="315.4" width="64.8" height="15.2" transform="rotate(45 777.2 323.0)" fill="#1D1E30" style="mix-blend-mode:multiply"/><rect x="797.0" y="337.0" width="16.4" height="6.7" transform="rotate(45 805.2 340.3)" fill="#1D1E30" style="mix-blend-mode:multiply"/><rect x="791.0" y="342.8" width="15.1" height="6.7" transform="rotate(45 798.5 346.1)" fill="#1D1E30" style="mix-blend-mode:multiply"/></g></g></g></g>
</svg>
