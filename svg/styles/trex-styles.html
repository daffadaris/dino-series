<h1>One Tyrannosaurus, ten styles</h1>
<p>Each version changes how the drawing is built: line, edge, texture and shape. Groups, pivots and idle motion are the same as svg/trex-animated.svg. The thumbnail and greyscale views check that every style can still be told apart.</p>
